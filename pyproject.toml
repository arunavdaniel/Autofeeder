[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-text-reader"
version = "0.1.0"
description = "Autofeedly local RSS automation and extraction app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "flask>=3.0",
    "jsonschema>=4.23",
    "playwright>=1.62",
    "requests>=2.31",
    "trafilatura>=2.2",
]

[project.scripts]
rss-text-reader = "rss_reader.web:main"

[tool.setuptools.packages.find]
include = ["rss_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
