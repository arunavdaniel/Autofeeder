[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-text-reader"
version = "0.1.0"
description = "Autofeeder local feed, web, and API extraction app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "feedparser>=6.0",
    "flask>=3.0",
    "jsonschema>=4.23",
    "requests>=2.31",
    "trafilatura>=2.2",
]

[project.scripts]
rss-text-reader = "rss_reader.web:main"

[project.optional-dependencies]
browser = ["playwright>=1.62"]
sync = [
    "psycopg[binary]>=3.1",
    "pymysql>=1.1",
    "pymssql>=2.3",
    "oracledb>=2.4",
]
embeddings = ["sentence-transformers>=3"]

[tool.setuptools.packages.find]
include = ["rss_reader*"]

[tool.setuptools.package-data]
rss_reader = [
    "data/*.json",
    "data/catalog_snapshots/*.json",
    "frontend_dist/**/*",
    "frontend_dist/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
