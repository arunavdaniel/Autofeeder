<!doctype html>
<html lang="en" class="theme">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autofeeder</title>
    <script>
      const theme = localStorage.getItem('autofeeder-theme') || localStorage.getItem('autofeedly-theme');
      const dark = theme === 'dark' || theme === 'black' || ((theme === 'system' || !theme) && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      }
      if (theme === 'black') document.documentElement.classList.add('theme-black');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
