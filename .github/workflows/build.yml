name: Build installers

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --clean --noconfirm packaging/rss-text-reader.spec
      - if: runner.os == 'macOS'
        run: hdiutil create -volname "RSS Text Reader" -srcfolder "dist/RSS Text Reader.app" -ov -format UDZO "dist/RSS-Text-Reader-macOS.dmg"
      - if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - if: runner.os == 'Windows'
        run: makensis packaging/windows/rss-text-reader.nsi
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2
          curl -L -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          mkdir -p dist/AppDir/usr/bin
          cp "dist/RSS Text Reader" dist/AppDir/usr/bin/
          cp packaging/linux/AppRun dist/AppDir/AppRun
          chmod +x dist/AppDir/AppRun
          ./appimagetool.AppImage dist/AppDir dist/RSS-Text-Reader-Linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: rss-text-reader-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            RSS-Text-Reader-Windows-Installer.exe
